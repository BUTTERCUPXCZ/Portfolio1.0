<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Must stay inline and blocking: it stamps the theme before first paint
         so the page never flashes the wrong palette. -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('theme') || 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Self-hosted variable fonts (see @font-face in src/index.css). -->
    <link
      rel="preload"
      href="/fonts/archivo.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      title, description, canonical, theme-color, Open Graph, Twitter card and
      schema.org JSON-LD are generated from src/data/profile.js at build time.
      See seoHead() in vite.config.js. Do not add them here by hand.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
